<svg width="680" height="450" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .container { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { stroke-width: 1.5; }
    .blue { fill: #dbeafe; stroke: #2563eb; }
    .teal { fill: #ccfbf1; stroke: #0d9488; }
    .gray { fill: #f1f5f9; stroke: #64748b; }
    .warn { fill: #ffedd5; stroke: #ea580c; }
    .th { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .ts { font-size: 11px; fill: #475569; }
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .arr { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Merged Gateways (EnvoyProxy.spec.mergeGateways)</text>

  <!-- Left: mergeGateways false -->
  <rect class="container" x="20" y="50" width="300" height="270" rx="10"/>
  <text class="title" x="170" y="75" text-anchor="middle">mergeGateways: false (기본)</text>

  <rect class="box blue" x="35" y="95" width="120" height="38" rx="6"/>
  <text class="th" x="95" y="118" text-anchor="middle">Gateway A</text>

  <rect class="box blue" x="185" y="95" width="120" height="38" rx="6"/>
  <text class="th" x="245" y="118" text-anchor="middle">Gateway B</text>

  <line x1="95" y1="133" x2="95" y2="175" class="arr" marker-end="url(#arrow3)"/>
  <line x1="245" y1="133" x2="245" y2="175" class="arr" marker-end="url(#arrow3)"/>

  <rect class="box gray" x="35" y="175" width="120" height="50" rx="6"/>
  <text class="th" x="95" y="196" text-anchor="middle">Envoy Fleet A</text>
  <text class="ts" x="95" y="213" text-anchor="middle">전용 Pod+Service</text>

  <rect class="box gray" x="185" y="175" width="120" height="50" rx="6"/>
  <text class="th" x="245" y="196" text-anchor="middle">Envoy Fleet B</text>
  <text class="ts" x="245" y="213" text-anchor="middle">전용 Pod+Service</text>

  <text class="ts" x="170" y="260" text-anchor="middle">Gateway 1개 = 전용 fleet 1개</text>
  <text class="ts" x="170" y="276" text-anchor="middle">(Envoy pod 2배, IP 2개 필요)</text>

  <!-- Right: mergeGateways true -->
  <rect class="container" x="360" y="50" width="300" height="270" rx="10"/>
  <text class="title" x="510" y="75" text-anchor="middle">mergeGateways: true</text>

  <rect class="box blue" x="375" y="95" width="120" height="38" rx="6"/>
  <text class="th" x="435" y="118" text-anchor="middle">Gateway A</text>

  <rect class="box blue" x="525" y="95" width="120" height="38" rx="6"/>
  <text class="th" x="585" y="118" text-anchor="middle">Gateway B</text>

  <line x1="435" y1="133" x2="480" y2="175" class="arr" marker-end="url(#arrow3)"/>
  <line x1="585" y1="133" x2="540" y2="175" class="arr" marker-end="url(#arrow3)"/>

  <rect class="box teal" x="440" y="175" width="140" height="50" rx="6"/>
  <text class="th" x="510" y="196" text-anchor="middle">공유 Envoy Fleet</text>
  <text class="ts" x="510" y="213" text-anchor="middle">Pod+Service 1개</text>

  <text class="ts" x="510" y="260" text-anchor="middle">여러 Gateway가 fleet 하나 공유</text>
  <text class="ts" x="510" y="276" text-anchor="middle">(IP 절약, port/hostname 중복 금지)</text>

  <!-- Warning note -->
  <rect class="warn" x="20" y="340" width="640" height="80" rx="8"/>
  <text class="th" x="340" y="366" text-anchor="middle" fill="#9a3412">GatewayNamespaceMode와 병행 불가</text>
  <text class="ts" x="340" y="386" text-anchor="middle" fill="#7c2d12">여러 팀의 Gateway를 하나의 fleet으로 합치면, 그 fleet을</text>
  <text class="ts" x="340" y="402" text-anchor="middle" fill="#7c2d12">어느 팀 네임스페이스에 둘지 결정할 수 없어 구조적으로 양립 불가</text>
</svg>
