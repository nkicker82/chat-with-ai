  <line x1="190" y1="206" x2="190" y2="250" class="arr" marker-end="url(#arrow1)"/>
  <line x1="490" y1="206" x2="490" y2="250" class="arr" marker-end="url(#arrow1)"/>

  <rect class="box gray" x="60" y="250" width="260" height="56" rx="8"/>
  <text class="th" x="190" y="272" text-anchor="middle">LoadBalancer Service</text>
