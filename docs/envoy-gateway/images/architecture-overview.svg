<svg width="680" height="536" viewBox="0 0 680 536" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { stroke-width: 1.5; }
    .purple { fill: #ede9fe; stroke: #7c3aed; }
    .teal { fill: #ccfbf1; stroke: #0d9488; }
    .gray { fill: #f1f5f9; stroke: #64748b; }
    .orange { fill: #ffedd5; stroke: #ea580c; }
    .th { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .ts { font-size: 12px; fill: #475569; }
    .arr { stroke: #64748b; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Cilium Gateway + Envoy Gateway + OpenStack CCM 연동 구조</text>

  <rect class="box purple" x="60" y="50" width="260" height="56" rx="8"/>
  <text class="th" x="190" y="72" text-anchor="middle">Gateway A</text>
  <text class="ts" x="190" y="90" text-anchor="middle">class: cilium</text>

  <rect class="box teal" x="360" y="50" width="260" height="56" rx="8"/>
  <text class="th" x="490" y="72" text-anchor="middle">Gateway B</text>
  <text class="ts" x="490" y="90" text-anchor="middle">class: envoy-gateway</text>

  <line x1="190" y1="106" x2="190" y2="150" class="arr" marker-end="url(#arrow1)"/>
  <line x1="490" y1="106" x2="490" y2="150" class="arr" marker-end="url(#arrow1)"/>

  <rect class="box purple" x="60" y="150" width="260" height="56" rx="8"/>
