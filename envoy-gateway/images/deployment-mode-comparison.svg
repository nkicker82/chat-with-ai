<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .container { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { stroke-width: 1.5; }
    .teal { fill: #ccfbf1; stroke: #0d9488; }
    .blue { fill: #dbeafe; stroke: #2563eb; }
    .purple { fill: #ede9fe; stroke: #7c3aed; }
    .gray { fill: #f1f5f9; stroke: #64748b; }
    .th { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .ts { font-size: 11px; fill: #475569; }
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
  </style>

  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Default 모드 vs GatewayNamespaceMode — 리소스 배치 비교</text>

  <rect class="container" x="20" y="50" width="300" height="340" rx="10"/>
  <text class="title" x="170" y="75" text-anchor="middle">Default 모드</text>

  <rect class="box gray" x="45" y="95" width="250" height="30" rx="6"/>
  <text class="ts" x="170" y="114" text-anchor="middle" font-weight="600">namespace: envoy-gateway-system</text>

  <rect class="box teal" x="55" y="140" width="230" height="40" rx="6"/>
  <text class="th" x="170" y="164" text-anchor="middle">컨트롤러</text>

  <rect class="box blue" x="55" y="195" width="230" height="40" rx="6"/>
  <text class="th" x="170" y="219" text-anchor="middle">Envoy Proxy (team-a용)</text>

  <rect class="box purple" x="55" y="250" width="230" height="40" rx="6"/>
  <text class="th" x="170" y="274" text-anchor="middle">Envoy Proxy (team-b용)</text>

  <text class="ts" x="170" y="320" text-anchor="middle">모든 테넌트의 데이터플레인이</text>
  <text class="ts" x="170" y="336" text-anchor="middle">한 네임스페이스에 공존</text>

  <rect class="container" x="360" y="50" width="300" height="340" rx="10"/>
  <text class="title" x="510" y="75" text-anchor="middle">GatewayNamespaceMode</text>

  <rect class="box gray" x="385" y="95" width="250" height="30" rx="6"/>
  <text class="ts" x="510" y="114" text-anchor="middle" font-weight="600">namespace: envoy-gateway-system</text>
  <rect class="box teal" x="395" y="140" width="230" height="40" rx="6"/>
  <text class="th" x="510" y="164" text-anchor="middle">컨트롤러만 위치</text>

  <rect class="box gray" x="385" y="195" width="250" height="30" rx="6"/>
  <text class="ts" x="510" y="214" text-anchor="middle" font-weight="600">namespace: team-a</text>
  <rect class="box blue" x="395" y="235" width="230" height="35" rx="6"/>
  <text class="th" x="510" y="257" text-anchor="middle">Envoy Proxy (team-a)</text>

  <rect class="box gray" x="385" y="285" width="250" height="30" rx="6"/>
  <text class="ts" x="510" y="304" text-anchor="middle" font-weight="600">namespace: team-b</text>
  <rect class="box purple" x="395" y="325" width="230" height="35" rx="6"/>
  <text class="th" x="510" y="347" text-anchor="middle">Envoy Proxy (team-b)</text>
</svg>
