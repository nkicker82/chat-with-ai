title: chat with ai
url: "https://nkicker82.github.io"
baseurl: "/chat-with-ai"

# 테마를 고정하려면 뒤에 @태그 를 붙입니다 (예: just-the-docs/just-the-docs@vX.Y.Z)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache         # Just the Docs 의존성
  - jekyll-optional-front-matter # front matter 없는 .md도 페이지로 변환
  - jekyll-relative-links        # [링크](other.md) → other.html 자동 변환
  - jekyll-titles-from-headings  # title 이 없으면 첫 번째 # 제목 사용

optional_front_matter:
  remove_originals: true         # 원본 .md 대신 변환된 .html만 서빙

relative_links:
  enabled: true
  collections: false

# 검색창, 제목 앵커
search_enabled: true
heading_anchors: true

# 폴더(claude/, envoy-gateway/ 등) 아래 문서에 테마 레이아웃 적용.
# 새 최상위 폴더를 추가하면 여기에도 같은 형태로 추가합니다.
# (path 를 "" 로 두면 테마의 CSS/JS 파일에도 적용되어 스타일이 깨질 수 있으니 폴더별로 지정)
defaults:
  - scope:
      path: "claude"
      type: pages
    values:
      layout: default
  - scope:
      path: "envoy-gateway"
      type: pages
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
