title: chat with ai
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-optional-front-matter   # front matter 없는 .md도 변환
  - jekyll-relative-links          # [링크](other.md) → other.html 자동 변환
  - jekyll-titles-from-headings    # 첫 번째 # 제목을 페이지 title로 사용
optional_front_matter:
  remove_originals: true           # 원본 .md 대신 .html만 서빙

