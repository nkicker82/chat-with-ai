title: chat with ai
url: "https://nkicker82.github.io"
baseurl: "/chat-with-ai"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache           # Just the Docs 의존성
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# 사이트에 올리고 싶지 않은 파일
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
